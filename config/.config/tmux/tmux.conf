# Ghostty cold-start PATH has no Homebrew. Plugin scripts call `tmux` bare
# (catppuccin, tpm, resurrect) and exit 127 without this.
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

set -g prefix C-b
set -g mouse on
set -g mode-keys vi
set -g default-terminal "xterm-256color"
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g display-panes-time 2000

# Drop every default prefix key. Plugin keys (resurrect C-s/C-r, TPM I/U)
# are re-attached when those plugins load below.
unbind-key -a

# --- prefix root ----------------------------------------------------------
bind -N "reload config" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind ㄱ source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind -N "command prompt" : command-prompt
bind -N "key cheat sheet" ? display-message -d 4000 "prefix: s session  w window  p pane  hjkl pane  0-9 window  [ ] copy  : cmd  r reload"
bind -N "copy mode" [ copy-mode
bind -N "paste" ] paste-buffer -p
bind -N "copy mode (page up)" PPage copy-mode -u
bind -N "send prefix" C-b send-prefix
bind -N "clear screen" C-l send-keys C-l

bind 0 select-window -t :=0
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9

bind -r -N "pane left" h select-pane -L
bind -r -N "pane down" j select-pane -D
bind -r -N "pane up" k select-pane -U
bind -r -N "pane right" l select-pane -R
bind -r ㅗ select-pane -L
bind -r ㅓ select-pane -D
bind -r ㅏ select-pane -U
bind -r ㅣ select-pane -R

bind -r C-Up resize-pane -U
bind -r C-Down resize-pane -D
bind -r C-Left resize-pane -L
bind -r C-Right resize-pane -R

# --- session / window / pane tables ---------------------------------------
# Ghostty remaps prefix+one physical letter to Latin. The second key of a
# table is a normal keystroke, so 두벌식 still commits jamo; bind both.
bind -N "session table" s switch-client -T session
bind ㄴ switch-client -T session
bind -N "window table" w switch-client -T window
bind ㅈ switch-client -T window
bind -N "pane table" p switch-client -T pane
bind ㅔ switch-client -T pane

# session: prefix + s + ...
bind -T session -N "list" l choose-tree -Zs
bind -T session ㅣ choose-tree -Zs
bind -T session -N "list" s choose-tree -Zs
bind -T session ㄴ choose-tree -Zs
bind -T session -N "create" c command-prompt -p "session name:" { new-session -A -s "%%" -c "#{pane_current_path}" }
bind -T session ㅊ command-prompt -p "session name:" { new-session -A -s "%%" -c "#{pane_current_path}" }
bind -T session -N "rename" r command-prompt -I "#S" { rename-session -- "%%" }
bind -T session ㄱ command-prompt -I "#S" { rename-session -- "%%" }
bind -T session -N "detach" d detach-client
bind -T session ㅇ detach-client
bind -T session -N "kill" k confirm-before -p "kill-session #S? (y/n)" kill-session
bind -T session ㅏ confirm-before -p "kill-session #S? (y/n)" kill-session
bind -T session -r -N "next" n switch-client -n
bind -T session -r ㅜ switch-client -n
bind -T session -r -N "prev" p switch-client -p
bind -T session -r ㅔ switch-client -p
bind -T session -N "last" o switch-client -l
bind -T session ㅐ switch-client -l
bind -T session ? display-message -d 3000 "session: l/s list  c create  r rename  d detach  k kill  n/p next/prev  o last"
bind -T session Escape switch-client -T root

# window: prefix + w + ...
bind -T window -N "list" l choose-tree -Zw
bind -T window ㅣ choose-tree -Zw
bind -T window -N "list" w choose-tree -Zw
bind -T window ㅈ choose-tree -Zw
bind -T window -N "create" c new-window -c "#{pane_current_path}"
bind -T window ㅊ new-window -c "#{pane_current_path}"
bind -T window -N "rename" r command-prompt -I "#W" { rename-window -- "%%" }
bind -T window ㄱ command-prompt -I "#W" { rename-window -- "%%" }
bind -T window -N "kill" k confirm-before -p "kill-window #W? (y/n)" kill-window
bind -T window ㅏ confirm-before -p "kill-window #W? (y/n)" kill-window
bind -T window -r -N "next" n next-window
bind -T window -r ㅜ next-window
bind -T window -r -N "prev" p previous-window
bind -T window -r ㅔ previous-window
bind -T window -N "last" o last-window
bind -T window ㅐ last-window
bind -T window -N "find" f command-prompt { find-window -Z "%%" }
bind -T window ㄹ command-prompt { find-window -Z "%%" }
bind -T window ? display-message -d 3000 "window: l/w list  c create  r rename  k kill  n/p next/prev  o last  f find"
bind -T window Escape switch-client -T root

# pane: prefix + p + ...
bind -T pane -N "list" l display-panes
bind -T pane ㅣ display-panes
bind -T pane -N "list" p display-panes
bind -T pane ㅔ display-panes
bind -T pane -N "split down" s split-window -v -c "#{pane_current_path}"
bind -T pane ㄴ split-window -v -c "#{pane_current_path}"
bind -T pane -N "split right" v split-window -h -c "#{pane_current_path}"
bind -T pane ㅍ split-window -h -c "#{pane_current_path}"
bind -T pane -N "rename" r command-prompt -I "#T" { select-pane -T "%%" }
bind -T pane ㄱ command-prompt -I "#T" { select-pane -T "%%" }
bind -T pane -N "kill" k confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind -T pane ㅏ confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind -T pane -r -N "next" n select-pane -t :.+
bind -T pane -r ㅜ select-pane -t :.+
bind -T pane -N "last" o last-pane
bind -T pane ㅐ last-pane
bind -T pane -N "zoom" z resize-pane -Z
bind -T pane ㅋ resize-pane -Z
bind -T pane -N "mark" m select-pane -m
bind -T pane ㅡ select-pane -m
bind -T pane -N "break" b break-pane
bind -T pane ㅠ break-pane
bind -T pane ? display-message -d 3000 "pane: l/p list  s split down  v split right  r title  k kill  n next  o last  z zoom  m mark  b break"
bind -T pane Escape switch-client -T root

# Hold Ctrl and tap h/j/k/l to move panes with no prefix.
# Each C-h/j/k/l is its own key event, so Ctrl can stay down while switching.
# When the pane is nvim, the key is forwarded so LazyVim splits keep working.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"

# Hold Ctrl+Shift and tap h/l to move windows with no prefix.
# Bind both cases: Ghostty may report 'h' or shifted 'H'.
bind -n C-S-h previous-window
bind -n C-S-H previous-window
bind -n C-S-l next-window
bind -n C-S-L next-window
bind -n C-S-c new-window -c "#{pane_current_path}"
bind -n C-S-C new-window -c "#{pane_current_path}"

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi C-\\ select-pane -l
bind -T copy-mode-vi C-S-h previous-window
bind -T copy-mode-vi C-S-H previous-window
bind -T copy-mode-vi C-S-l next-window
bind -T copy-mode-vi C-S-L next-window
bind -T copy-mode-vi C-S-c new-window -c "#{pane_current_path}"
bind -T copy-mode-vi C-S-C new-window -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Catppuccin reads these at load time — set them before `run`.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# v2 uses window_text (not window_default_text). Default #T is the
# hostname (soominui-MacBookAir.local); drop the host prefix and keep "local".
set -g @catppuccin_window_text " local"
set -g @catppuccin_window_current_text " local"

# Restore is triggered by ~/.config/ghostty/tmux-restore when no server exists.
# Continuum auto-restore is off so it does not race with that bootstrap session.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @resurrect-hook-post-restore-all 'tmux kill-session -t _ghostty_boot 2>/dev/null || true'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-left "#{E:@catppuccin_status_session}"
set -ag status-left " "
set -g status-right "#{E:@catppuccin_status_application}"

# TPM last so continuum can prepend its silent auto-save hook to status-right.
run ~/.config/tmux/plugins/tpm/tpm

# Gap under the top status bar. tmux is cell-sized so this is one row;
# Ghostty can't insert padding between the bar and the pane grid.
# set -g status 2
# set -g status-format[1] "#[bg=#000000,fg=#000000]"

# 알림설정 켜기
set-window-option -g monitor-bell on
set-window-option -g monitor-activity on
set -g visual-bell on
set -g visual-activity on
